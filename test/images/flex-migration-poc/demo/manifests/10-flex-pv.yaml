apiVersion: v1
kind: PersistentVolume
metadata:
  name: flex-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: demo
    name: flex-pvc
  flexVolume:
    driver: example.com/fake
    options:
      path: pv-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flex-pvc
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: flex-pv
  resources:
    requests:
      storage: 1Gi
