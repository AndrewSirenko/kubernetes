apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: fake.csi.example.com
  annotations:
    storage.kubernetes.io/migrated-from-flexvolume: example.com/fake
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes: [Persistent]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fake-csi
  namespace: kube-system
spec:
  selector:
    matchLabels: {app: fake-csi}
  template:
    metadata:
      labels: {app: fake-csi}
    spec:
      nodeSelector:
        kubernetes.io/hostname: flexpoc-worker
      terminationGracePeriodSeconds: 1
      containers:
      - name: fake-csi
        image: localhost/fake-csi:poc
        imagePullPolicy: Never
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        volumeMounts:
        - name: kubelet
          mountPath: /var/lib/kubelet
          mountPropagation: Bidirectional
        - name: registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: storage
          mountPath: /var/lib/fake-storage
      volumes:
      - name: kubelet
        hostPath: {path: /var/lib/kubelet, type: Directory}
      - name: registry
        hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
      - name: storage
        hostPath: {path: /var/lib/fake-storage, type: DirectoryOrCreate}
